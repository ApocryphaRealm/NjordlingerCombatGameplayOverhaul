; Njordlinger Combat Gameplay Overhaul - settings. Every value here is also the compiled default (rule 16);
; the settings page in the Apocrypha Menu Framework edits this file.

[Debug]
; 0 trace, 1 debug, 2 info, 3 warning, 4 error, 5 critical, 6 off
uLogLevel=2

[Skills]
; 1 = each skill stops at fCap<Skill>; 0 = 100 as in vanilla. A class's locked skills are capped either way.
bOverrideSkillCaps=0
fCapOneHanded=100.00
fCapTwoHanded=100.00
fCapArchery=100.00
fCapBlock=100.00
fCapSmithing=100.00
fCapHeavyArmor=100.00
fCapLightArmor=100.00
fCapPickpocket=100.00
fCapLockpicking=100.00
fCapSneak=100.00
fCapAlchemy=100.00
fCapSpeech=100.00
fCapAlteration=100.00
fCapConjuration=100.00
fCapDestruction=100.00
fCapIllusion=100.00
fCapRestoration=100.00
fCapEnchanting=100.00

[SkillExperience]
; 1 = each use pays vanilla x fMult<Skill>, an increase pays vanilla x fSkillToLevelMult toward the level
bOverrideSkillExp=0
fSkillToLevelMult=1.00
fMultOneHanded=1.00
fMultTwoHanded=1.00
fMultArchery=1.00
fMultBlock=1.00
fMultSmithing=1.00
fMultHeavyArmor=1.00
fMultLightArmor=1.00
fMultPickpocket=1.00
fMultLockpicking=1.00
fMultSneak=1.00
fMultAlchemy=1.00
fMultSpeech=1.00
fMultAlteration=1.00
fMultConjuration=1.00
fMultDestruction=1.00
fMultIllusion=1.00
fMultRestoration=1.00
fMultEnchanting=1.00

[LevelUp]
; 1 = perk points from sPerksByLevel, attribute gains from the three values below (all 0: the attribute pick is skipped)
bOverrideLevelUpRewards=1
; level:perks pairs - from each listed level on, that many perk points per level up
sPerksByLevel=1:1
fHealthPerLevel=0.00
fMagickaPerLevel=0.00
fStaminaPerLevel=0.00

[Classes]
bEnableClasses=1
; class levels between two evolutions
iClassLevelsPerTier=10
fClassXpPerSkillIncrease=1.00
; class level n -> n+1 costs fClassXpBase + fClassXpPerLevel x n
fClassXpBase=2.00
fClassXpPerLevel=0.20
bLockPerks=1
bLockSkills=1
bCraftingGate=1
; the Class category in the race menu
bRaceMenuClass=1

[QuestRewards]
; rows: quest-rewards.json; a row you change is kept under [QuestRewardRows] as <EditorID>=<points>
bEnableQuestRewards=1

[QuestRewardRows]
